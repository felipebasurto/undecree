name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Evals (scanner, held-out rounds, review page)
        run: python3 skills/undecree/evals/run_evals.py --gate-holdout
      - name: Render the demo review page
        run: python3 skills/undecree/scripts/make_review.py examples/demo/items.json -o "$RUNNER_TEMP/review.html"
